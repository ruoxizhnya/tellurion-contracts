name: CI

# 本仓最小门禁（ADR-D29 R2「单仓可自证」）：格式 + 构建 + 静态检查 + 导出面登记核对 + 版本纪律核对 + 测试。
# 本仓**不得** checkout 其他仓 —— 需要别的仓源码才能过，就是边界画错了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是「版本纪律核对」那条腿的前提：默认只取 HEAD，
      # git tag 会恒为空，tag ↔ CHANGELOG ↔ 矩阵的对拍就变成假绿。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt（未格式化即红）
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请跑 gofmt -w："
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: 导出面核对（CT-01 护栏：新增导出符号未登记进 docs/API.md 即红）
        run: go run ./tools/check_api_surface

      - name: 版本纪律核对（CT-02 护栏：矩阵 ↔ CHANGELOG ↔ tag 不一致即红）
        run: go run ./tools/check_release_matrix

      - name: 契约形状核对（QT-09 ⑤：*Config/*Options/*Impl 命名与 DB/驱动 import 即红）
        run: go run ./tools/check_contract_shape

      - name: 导出面签名冻结（QT-09：形状指纹与 docs/api-surface.txt 不一致即红）
        run: go run ./tools/check_surface_freeze

      # PR 正文只在 pull_request 事件里有意义。其他事件（push / workflow_dispatch）由 if
      # 显式跳过并打印原因；真正的核对步骤不会以「跳过」冒充「通过」。
      - name: PR 模板核对不适用（显式跳过）
        if: github.event_name != 'pull_request'
        run: echo "跳过 tools/check_pr_body：当前事件是 ${GITHUB_EVENT_NAME}，该护栏只在 pull_request 事件核对 PR 正文。"

      - name: PR 模板必填项核对（仅 pull_request 事件）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | go run ./tools/check_pr_body

      - name: Test
        run: go test ./... -count=1
